<!doctype html>
<!-- What this is: the page the filming tool opens in a hidden browser for cinema chapters. It loads
     the cinema stage and one chapter scene (named in the address, ?scene=...), then waits for
     window.renderFrame(seconds) calls. If the scene fails to load, window.stageFailed says why. -->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Inter'; font-weight: 400; src: url('/paper-film/node_modules/@fontsource/inter/files/inter-latin-400-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Inter'; font-weight: 500; src: url('/paper-film/node_modules/@fontsource/inter/files/inter-latin-500-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Inter'; font-weight: 600; src: url('/paper-film/node_modules/@fontsource/inter/files/inter-latin-600-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Inter'; font-weight: 700; src: url('/paper-film/node_modules/@fontsource/inter/files/inter-latin-700-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Inter'; font-weight: 800; src: url('/paper-film/node_modules/@fontsource/inter/files/inter-latin-800-normal.woff2') format('woff2'); }
  html, body { margin: 0; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="stage" width="1080" height="1920"></canvas>
<script type="importmap">{ "imports": { "three": "/paper-film/node_modules/three/build/three.module.js" } }</script>
<script type="module">
  try {
    const sceneName = new URLSearchParams(location.search).get('scene');
    const sceneModule = await import(`../scenes/${sceneName}.js`);
    const built = await sceneModule.build();
    window.sceneInfo = { start: built.start, end: built.end, pageEdges: built.pageEdges ?? [] };
    window.renderFrame = (seconds) => built.renderFrame(seconds);
    // a lazy chapter builds the pages a moment shows when asked (cinema-chapter.js); others need nothing
    window.prepareFrame = (seconds) => built.prepare?.(seconds);
    window.built = built;
    window.stageReady = true;
  } catch (error) {
    window.stageFailed = String(error && error.stack ? error.stack : error);
  }
</script>
</body>
</html>
