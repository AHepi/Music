<!doctype html>
<!-- What this is: the page the renderer opens in a hidden browser. It loads the paper stage and one
     scene (named in the address, ?scene=...), then waits for window.renderFrame(seconds) calls. -->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Inter'; font-weight: 800; src: url('/paper-film/node_modules/@fontsource/inter/files/inter-latin-800-normal.woff2') format('woff2'); }
  html, body { margin: 0; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="stage" width="1080" height="1920"></canvas>
<script type="module">
  import * as stage from './paper-stage.js';
  const sceneName = new URLSearchParams(location.search).get('scene');
  const sceneModule = await import(`../scenes/${sceneName}.js`);
  const built = await sceneModule.build(stage);
  window.sceneInfo = { start: built.start, end: built.end };
  window.renderFrame = (seconds) => { built.pose(seconds); return stage.drawFrame(); };
  window.stage = stage;
  window.stageReady = true;
</script>
</body>
</html>
