</head><body>
<script type="module">
// Cost test for cheap visual effects in the same hidden browser + software graphics (SwiftShader) the film uses.
// One page = one effect (?fx=name); the runner loads each in turn and times frames at 1080 x 1920.
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// the project's own brick works model (about 34,000 triangles)

const model = gltf.scene;
const box = new THREE.Box3().setFromObject(model); const size = box.getSize(new THREE.Vector3());
const k = 5.5 / Math.max(size.x, size.z); model.scale.setScalar(k);
const box2 = new THREE.Box3().setFromObject(model); const c = box2.getCenter(new THREE.Vector3());
model.position.set(-c.x, -box2.min.y, -c.z - 1.0);
let tris = 0;
let lightmap = null;

model.traverse((o) => {
  if (!o.isMesh) return;
  tris += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3;
  o.castShadow = useShadows; o.receiveShadow = useShadows;
  if (fx === 'basic') {           // "baked" look: unlit textures only
    const m = o.material; o.material = new THREE.MeshBasicMaterial({ map: m.map || null, color: m.color || 0xffffff });
  }
  if (fx === 'baked' && !/glow/.test(o.name) && o.geometry.attributes.uv1) {   // baked light: texture x light map, no lamp maths
    const m = o.material; o.material = new THREE.MeshBasicMaterial({ map: m.map || null, color: m.color || 0xffffff, lightMap: lightmap, lightMapIntensity: 2.0 });
  }
  if (fx === 'toon') {
    const m = o.material; o.material = new THREE.MeshToonMaterial({ map: m.map || null, color: m.color || 0xffffff });
  }
});
scene.add(model);
if (fx === 'hull') {                  // ink outline by the "inverted hull" trick: a slightly larger black back-face copy
  const hullMat = new THREE.MeshBasicMaterial({ color: 0x111111, side: THREE.BackSide });
  const meshes = []; model.traverse((o) => { if (o.isMesh) meshes.push(o); });
  for (const o of meshes) { const h = new THREE.Mesh(o.geometry, hullMat); h.scale.setScalar(1.015); o.add(h); }
}
if (fx === 'fog') scene.fog = new THREE.FogExp2(0x3a4655, 0.07);

// soft round sprite for particles
function softSprite(size = 64) {
  const cv = document.createElement('canvas'); cv.width = cv.height = size; const g = cv.getContext('2d');
  const gr = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, size, size); const t = new THREE.CanvasTexture(cv); return t;
}
const animated = [];
function points(n, size, color, spread, blending = THREE.AdditiveBlending, opacity = 0.6) {
  const pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { pos[3 * i] = (Math.random() - 0.5) * spread[0]; pos[3 * i + 1] = Math.random() * spread[1]; pos[3 * i + 2] = (Math.random() - 0.5) * spread[2]; }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const p = new THREE.Points(g, new THREE.PointsMaterial({ size, color, map: softSprite(), transparent: true, opacity, depthWrite: false, blending }));
  scene.add(p); animated.push((t) => { const a = g.attributes.position.array; for (let i = 1; i < a.length; i += 3) { a[i] -= 0.01; if (a[i] < 0) a[i] += spread[1]; } g.attributes.position.needsUpdate = true; });
  return p;
}
if (fx === 'dust') points(20000, 0.035, 0xffd9a0, [10, 8, 10]);
if (fx === 'snow') points(8000, 0.07, 0xffffff, [12, 10, 12], THREE.NormalBlending, 0.9);
if (fx === 'sparks') points(600, 0.06, 0xffa040, [2, 3, 2]);
if (fx === 'rain') {
  const n = 4000, pos = new Float32Array(n * 6);
  for (let i = 0; i < n; i++) { const x = (Math.random() - 0.5) * 12, y = Math.random() * 10, z = (Math.random() - 0.5) * 12; pos.set([x, y, z, x + 0.02, y - 0.35, z], i * 6); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  scene.add(new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color: 0xaabbcc, transparent: true, opacity: 0.35 })));
  animated.push(() => { const a = g.attributes.position.array; for (let i = 1; i < a.length; i += 3) { a[i] -= 0.3; if (a[i] < 0) a[i] += 10; } g.attributes.position.needsUpdate = true; });
}
if (fx === 'smoke') {                 // 40 big soft sprites, alpha blended: the overdraw-heavy case
  const mat = new THREE.SpriteMaterial({ map: softSprite(128), color: 0x8a8f96, transparent: true, opacity: 0.22, depthWrite: false });
  for (let i = 0; i < 40; i++) { const s = new THREE.Sprite(mat); s.position.set(-1.5 + Math.random() * 1.5, 3 + Math.random() * 5, -2 + Math.random()); s.scale.setScalar(2 + Math.random() * 3); scene.add(s); }
}
if (fx === 'shafts') {                // fake light beams: open cones with a soft additive gradient
  const mat = new THREE.ShaderMaterial({ transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
    uniforms: { col: { value: new THREE.Color(0xffc070) } },
    vertexShader: 'varying float vY; varying vec3 vN; varying vec3 vV; void main(){ vY = position.y; vN = normalize(normalMatrix*normal); vec4 mv = modelViewMatrix*vec4(position,1.0); vV = normalize(-mv.xyz); gl_Position = projectionMatrix*mv; }',
    fragmentShader: 'uniform vec3 col; varying float vY; varying vec3 vN; varying vec3 vV; void main(){ float fall = smoothstep(-3.0, 3.0, vY); float edge = pow(abs(dot(vN, vV)), 1.5); gl_FragColor = vec4(col * 0.25 * fall * edge, 1.0); }' });
  for (let i = 0; i < 3; i++) { const cone = new THREE.Mesh(new THREE.ConeGeometry(1.4, 6, 32, 1, true), mat); cone.position.set(-2 + i * 2, 4, -1.5); cone.rotation.z = 0.35; scene.add(cone); }
}
if (fx === 'crowd') {                 // 400 painted cut-out figures in one instanced draw
  const t = await texLoader.loadAsync('assets/worker-small.png'); t.colorSpace = THREE.SRGBColorSpace;
  const im = new THREE.InstancedMesh(new THREE.PlaneGeometry(0.45, 1.2), new THREE.MeshBasicMaterial({ map: t, alphaTest: 0.5, side: THREE.DoubleSide }), 400);
  const m = new THREE.Matrix4();
  for (let i = 0; i < 400; i++) { m.makeTranslation((i % 20 - 10) * 0.45 + Math.random() * 0.1, 0.6, 3 - Math.floor(i / 20) * 0.5); im.setMatrixAt(i, m); }
  scene.add(im);
}
if (fx === 'layers') {                // five full-frame see-through painted layers (parallax planes)
  const t = await texLoader.loadAsync('assets/worker-standing.png'); t.colorSpace = THREE.SRGBColorSpace;
  for (let i = 0; i < 5; i++) { const p = new THREE.Mesh(new THREE.PlaneGeometry(4, 7), new THREE.MeshBasicMaterial({ map: t, transparent: true, depthWrite: false })); p.position.set(0, 3, 5 - i); scene.add(p); }
}

// post effects
let composer = null;
const grainShader = { uniforms: { tDiffuse: { value: null }, time: { value: 0 } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
  fragmentShader: 'uniform sampler2D tDiffuse; uniform float time; varying vec2 vUv; float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233)) + time) * 43758.5453); } void main(){ vec3 c = texture2D(tDiffuse, vUv).rgb; c += (h(vUv*1000.0)-0.5)*0.06; float v = smoothstep(0.95, 0.35, length(vUv-0.5)); gl_FragColor = vec4(c*mix(0.6,1.0,v), 1.0); }' };
function kuwahara(R) { return { uniforms: { tDiffuse: { value: null }, res: { value: new THREE.Vector2(W, H) } },
  vertexShader: grainShader.vertexShader,
  fragmentShader: `uniform sampler2D tDiffuse; uniform vec2 res; varying vec2 vUv;
  void main(){ vec2 px = 1.0/res; vec3 m[4]; vec3 s[4]; for(int k=0;k<4;k++){ m[k]=vec3(0.0); s[k]=vec3(0.0);}
  for(int j=-${R};j<=0;j++) for(int i=-${R};i<=0;i++){ vec3 c=texture2D(tDiffuse,vUv+vec2(i,j)*px).rgb; m[0]+=c; s[0]+=c*c; }
  for(int j=-${R};j<=0;j++) for(int i=0;i<=${R};i++){ vec3 c=texture2D(tDiffuse,vUv+vec2(i,j)*px).rgb; m[1]+=c; s[1]+=c*c; }
  for(int j=0;j<=${R};j++) for(int i=0;i<=${R};i++){ vec3 c=texture2D(tDiffuse,vUv+vec2(i,j)*px).rgb; m[2]+=c; s[2]+=c*c; }
  for(int j=0;j<=${R};j++) for(int i=-${R};i<=0;i++){ vec3 c=texture2D(tDiffuse,vUv+vec2(i,j)*px).rgb; m[3]+=c; s[3]+=c*c; }
  float n = float((${R}+1)*(${R}+1)); float best=1e9; vec3 outc=vec3(0.0);
  for(int k=0;k<4;k++){ vec3 mu=m[k]/n; vec3 v=abs(s[k]/n-mu*mu); float sv=v.r+v.g+v.b; if(sv<best){best=sv; outc=mu;} }
  gl_FragColor=vec4(outc,1.0); }` }; }
if (['bloom', 'dof', 'grain', 'kuwahara4', 'kuwahara6', 'allpost'].includes(fx)) {
  composer = new EffectComposer(renderer); composer.setPixelRatio(1); composer.setSize(W, H);
  composer.addPass(new RenderPass(scene, camera));
  if (fx === 'bloom' || fx === 'allpost') composer.addPass(new UnrealBloomPass(new THREE.Vector2(W, H), 0.6, 0.4, 0.85));
  if (fx === 'dof' || fx === 'allpost') composer.addPass(new BokehPass(scene, camera, { focus: 9.0, aperture: 0.0025, maxblur: 0.01 }));
  if (fx === 'kuwahara4') composer.addPass(new ShaderPass(kuwahara(4)));
  if (fx === 'kuwahara6') composer.addPass(new ShaderPass(kuwahara(6)));
  composer.addPass(new OutputPass());
  if (fx === 'grain' || fx === 'allpost') composer.addPass(new ShaderPass(grainShader));
}
let frame = 0;
function drawOnce() {
  frame++; for (const f of animated) f(frame);
  if (composer) composer.render(); else renderer.render(scene, camera);
  return renderer.domElement.toDataURL('image/jpeg', 0.9);
}
window.__info = { fx, triangles: Math.round(tris) };
window.__bench = async (n = 4) => {
  drawOnce();                           // warm-up: compiles the shaders
  const times = []; let url = '';
  for (let i = 0; i < n; i++) { const s = performance.now(); url = drawOnce(); times.push(performance.now() - s); await new Promise(r => setTimeout(r, 50)); }
  const g = performance.now(); renderer.domElement.toDataURL('image/jpeg', 0.9); const grab = performance.now() - g;
  return { times, grab, url };
};
window.__ready = true;
</script></body></html>
